name: Build ATLAS Futurica Android APK

on:
workflow_dispatch:
push:
branches: [main]

jobs:
build:
runs-on: ubuntu-latest
steps:
- name: Download repository
uses: actions/checkout@v4

  - name: Find and extract project ZIP
    run: |
      sudo apt-get update
      sudo apt-get install -y unzip
      ZIP=$(find . -maxdepth 3 -iname '*Cloud*Build*Package*.zip' -print -quit)
      if [ -z "$ZIP" ]; then
        echo "Build ZIP not found in repository"
        exit 1
      fi
      mkdir -p /tmp/atlas
      unzip -q "$ZIP" -d /tmp/atlas
      SETTINGS=$(find /tmp/atlas -name settings.gradle -print -quit)
      if [ -z "$SETTINGS" ]; then
        echo "Android project not found inside ZIP"
        exit 1
      fi
      cp -a "$(dirname "$SETTINGS")"/. .

  - name: Set up Java
    uses: actions/setup-java@v4
    with:
      distribution: temurin
      java-version: '17'

  - name: Set up Android SDK
    uses: android-actions/setup-android@v3

  - name: Set up Gradle
    uses: gradle/actions/setup-gradle@v4

  - name: Build APK
    run: gradle assembleDebug

  - name: Upload APK
    uses: actions/upload-artifact@v4
    with:
      name: ATLAS-Futurica-debug-APK
      path: app/build/outputs/apk/debug/*.apk
      if-no-files-found: error
